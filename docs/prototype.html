<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Сообщество Wild Rift — эскиз</title><style>
:root{color-scheme:dark;font:16px/1.6 system-ui;background:#10141c;color:#e9edf6}*{box-sizing:border-box}body{margin:0}header{border-bottom:1px solid #303747;padding:24px;max-width:1040px;margin:auto}h1{font-size:25px;margin:8px 0}small,.muted{color:#aab5c8}.badge{color:#c3ef8a;font-size:12px;letter-spacing:1px}main{max-width:800px;margin:auto;padding:24px 18px 140px}article{background:#1a2130;border:1px solid #303c51;border-radius:18px;padding:22px;margin:16px 0}h2,h3,p{margin:0 0 12px}button{cursor:pointer;border:1px solid #43506a;background:#263149;color:inherit;padding:11px 16px;border-radius:10px;font:inherit;min-height:44px}button:hover,button:focus-visible{outline:2px solid #b9e681}button.primary{background:#c3ef8a;color:#14200c;border:0}nav{position:fixed;bottom:0;background:#111824f5;border-top:1px solid #36415a;width:100%;display:flex;justify-content:center;padding:12px 8px calc(12px + env(safe-area-inset-bottom));gap:6px}nav button{font-size:13px;padding:9px 12px;background:transparent;border:0}nav button[aria-current=page]{background:#c3ef8a;color:#14200c}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.tag{font-size:12px;padding:4px 9px;border:1px solid #48546b;border-radius:20px}.avatar{width:42px;height:42px;border-radius:14px;background:#6c538d;display:grid;place-items:center;font-weight:700}textarea,input{font:inherit;width:100%;background:#0e1624;color:inherit;border:1px solid #526078;border-radius:10px;padding:12px;margin-bottom:14px}textarea{min-height:100px}.notice{background:#233421;border:1px solid #537645;padding:12px;border-radius:12px;margin-bottom:18px}dialog{max-width:480px;width:calc(100% - 32px);background:#1a2130;color:inherit;border:1px solid #607086;border-radius:18px}dialog::backdrop{background:#000a}#status{position:fixed;bottom:90px;left:16px;right:16px;max-width:700px;margin:auto;background:#34462d;border-radius:12px;padding:12px}#status:empty{display:none}@media(max-width:400px){nav button{font-size:12px;padding:8px}article{padding:17px}}
</style><header><span class="badge">ПРОЕКТ БЕЗ НАЗВАНИЯ / ЭСКИЗ 0.1</span><h1>Твои люди в Wild Rift</h1><small>Кликабельная схема. Все записи вымышлены. Нет регистрации, сервера и сохранения данных.</small></header><main id="screen"></main><nav aria-label="Основная навигация"><button data-tab="feed">Лента</button><button data-tab="clubs">Клубы</button><button data-tab="play">Играть</button><button data-tab="chats">Чаты</button><button data-tab="profile">Профиль</button></nav><div id="status" role="status"></div><dialog id="compose"><h2>Новая публикация</h2><p class="muted">Демонстрация редактора. Публикация никуда не отправляется.</p><label for="postText">Текст</label><textarea id="postText" placeholder="Чем хочешь поделиться?"></textarea><div class="row"><button id="previewPost" class="primary">Предпросмотр</button><button id="closeDialog">Закрыть</button></div><p id="previewText" style="margin-top:16px;white-space:pre-wrap"></p></dialog><script>
const screen=document.getElementById('screen');
const pages={feed:`<div class="row"><h2>Лента</h2><button class="primary" data-action="compose">Написать</button></div><p class="muted">Подписки · Публикации клубов</p><article><div class="row"><div class="avatar">И</div><div><b>Игрок 01</b><br><small>Демонстрационный клуб · сегодня</small></div></div><h3 style="margin-top:18px">Собираемся на вечер игры</h3><p>Ищем спокойную компанию. Обсудим роли и сыграем несколько матчей.</p><div class="row"><button data-action="react">Нравится · 0</button><button data-action="comments">Обсудить</button><button data-action="save">Сохранить</button></div></article><article><span class="tag">Обсуждение</span><h3 style="margin-top:12px">Какой момент из игры вам запомнился?</h3><p class="muted">Здесь будут реальные истории участников. Сейчас это пример карточки.</p></article>`,clubs:`<h2>Клубы</h2><p class="muted">Найди компанию по интересам</p><article><span class="tag">Открытый · демо</span><h3 style="margin-top:12px">Любители леса</h3><p>Общаемся о роли, делимся моментами и ищем напарников.</p><button data-action="join" class="primary">Вступить</button></article><article><span class="tag">По заявкам · демо</span><h3 style="margin-top:12px">Спокойные вечера</h3><p>Небольшая компания для совместной игры.</p><button data-action="request">Подать заявку</button></article>`,play:`<h2>Играть вместе</h2><p class="muted">Пример поиска компании</p><article><div class="row"><span class="tag">Русский</span><span class="tag">Роль: лес</span></div><h3 style="margin-top:14px">Нужен пятый игрок</h3><p>4 из 5 мест заняты · Начинаем после сбора</p><p class="muted">Голос по желанию. Игровые сведения в реальном приложении указывают участники.</p><button class="primary" data-action="apply">Откликнуться</button></article><article><h3>Своя группа</h3><p>Выберешь режим, регион, роли и время начала.</p><button data-action="createGroup">Создать группу</button></article>`,chats:`<h2>Чаты</h2><div class="notice">Запросы от незнакомых людей находятся отдельно.</div><article><h3>Общий чат клуба</h3><p class="muted">Демо-сообщение: «Кто будет играть вечером?»</p><label for="message">Ответ</label><input id="message" placeholder="Написать сообщение"><button data-action="send" class="primary">Отправить в демо</button><div id="demoMessages"></div></article><article><h3>Запросы сообщений</h3><p>Нет запросов. Здесь можно принять или отклонить первую переписку.</p></article>`,profile:`<h2>Профиль</h2><article><div class="avatar">ТЫ</div><h3 style="margin-top:12px">Игрок — демонстрация</h3><p class="muted">Игровое имя и ранг не подтверждены</p><div class="row"><span class="tag">Лес</span><span class="tag">Общение</span></div><p style="margin-top:16px">Обложка, описание, любимые чемпионы и закреплённые публикации.</p><button data-action="privacy">Приватность</button></article><article><h3>Твои материалы</h3><p>Публикации · Сохранённое · Клубы</p><small>Сохранённое видно только владельцу профиля.</small></article>`};
function announce(t){document.getElementById('status').textContent=t;clearTimeout(window.timer);window.timer=setTimeout(()=>document.getElementById('status').textContent='',4500)}
function show(tab){screen.innerHTML=pages[tab];document.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-current',b.dataset.tab===tab?'page':'false'));window.scrollTo(0,0)}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>show(b.dataset.tab));
screen.onclick=e=>{const b=e.target.closest('[data-action]');if(!b)return;switch(b.dataset.action){case'compose':document.getElementById('compose').showModal();break;case'react':b.textContent=b.textContent.endsWith('0')?'Нравится · 1':'Нравится · 0';break;case'save':b.textContent='Сохранено в демо';announce('Состояние сбросится при смене вкладки.');break;case'join':b.textContent='Вы вступили — демо';announce('В приложении после вступления откроется чат клуба.');break;case'request':case'apply':b.textContent='Заявка — демо';announce('Здесь автор рассмотрит заявку. Ничего не отправлено.');break;case'send':{const i=document.getElementById('message');if(!i.value.trim())return;const p=document.createElement('p');p.textContent='Ты: '+i.value;document.getElementById('demoMessages').append(p);i.value='';break}case'privacy':announce('Настройки: видимость Riot ID, личные сообщения, приглашения и блокировки.');break;case'comments':announce('Следующий экран: обсуждение поста, ответы и жалоба.');break;case'createGroup':announce('Будущая форма: режим, регион, язык, роли, места и время.');break}};
document.getElementById('closeDialog').onclick=()=>document.getElementById('compose').close();document.getElementById('previewPost').onclick=()=>{document.getElementById('previewText').textContent=document.getElementById('postText').value||'Напиши текст для предпросмотра.'};show('feed');
</script></html>

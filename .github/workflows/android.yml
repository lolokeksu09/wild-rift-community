name: Android
on:
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
  push:
    branches: [main, codex/android-account-client]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  guest:
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            android/*.gradle.kts
            android/gradle/wrapper/gradle-wrapper.properties
      - name: Set up Android SDK explicitly
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          log-accepted-android-sdk-licenses: false
      - name: Verify wrapper and install SDK
        run: |
          echo '7d3a4ac4de1c32b59bc6a4eb8ecb8e612ccd0cf1ae1e99f66902da64df296172  android/gradle/wrapper/gradle-wrapper.jar' | sha256sum -c -
          chmod +x android/gradlew
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Build APK, lint and unit tests
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest lintDebug testDebugUnitTest
      - name: Free temporary runner space for emulator
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk
          df -h .
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and verify real guest flow
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disk-size: 4096M
          ram-size: 2048M
          emulator-boot-timeout: 300
          disable-animations: false
          script: |
            cd android && ./gradlew --no-daemon connectedDebugAndroidTest
            adb pull /sdcard/Download/wr-onboarding android/app/build/device-screenshots
      - name: Save APK and validation reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-guest-preview
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/reports/
            android/app/build/device-screenshots/
          if-no-files-found: warn
          retention-days: 14


  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/codex/android-account-client'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check existing publication
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          released=$(gh api "repos/$GITHUB_REPOSITORY/releases" --jq '.[] | select(.tag_name=="android-v0.5.0-preview" and .draft==false) | .id')
          if test -n "$released"; then echo 'released=true' >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            android/*.gradle.kts
            android/gradle/wrapper/gradle-wrapper.properties
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          log-accepted-android-sdk-licenses: false
      - name: Build and validate preview
        if: steps.guard.outputs.released != 'true'
        run: |
          set -euo pipefail
          echo '7d3a4ac4de1c32b59bc6a4eb8ecb8e612ccd0cf1ae1e99f66902da64df296172  android/gradle/wrapper/gradle-wrapper.jar' | sha256sum -c -
          chmod +x android/gradlew
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
          cd android
          ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest lintDebug testDebugUnitTest
      - name: Free temporary runner space for onboarding emulator
        if: steps.guard.outputs.released != 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk
          df -h .
      - name: Enable KVM for onboarding checks
        if: steps.guard.outputs.released != 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify onboarding on Android
        if: steps.guard.outputs.released != 'true'
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disk-size: 4096M
          ram-size: 2048M
          emulator-boot-timeout: 300
          disable-animations: false
          script: |
            cd android && ./gradlew --no-daemon connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=ru.wrcommunity.android.WelcomeUiTest
            adb pull /sdcard/Download/wr-onboarding android/app/build/device-screenshots
      - name: Publish verified APK
        if: steps.guard.outputs.released != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          apk=wr-community-0.5.0-preview.apk
          tag=android-v0.5.0-preview
          cp android/app/build/outputs/apk/debug/app-debug.apk "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk"
          sha256sum "$apk" > SHA256SUMS.txt
          hash=$(sha256sum "$apk" | cut -d ' ' -f1)
          cp docs/android/RELEASE_0_5.md release-notes.md
          printf '\nИсходный commit APK: `%s`.\nSHA256: `%s`.\n' "$GITHUB_SHA" "$hash" >> release-notes.md
          if gh release view "$tag" >/dev/null 2>&1; then
            echo 'Version already exists; do not overwrite a published APK.'
            exit 1
          fi
          gh release create "$tag" --target "$GITHUB_SHA" --title 'Android 0.5.0-preview — полноэкранные обложки' --notes-file release-notes.md --prerelease --draft
          gh release upload "$tag" "$apk" SHA256SUMS.txt
          uploaded=$(gh api "repos/$GITHUB_REPOSITORY/releases" --jq '.[] | select(.tag_name=="android-v0.5.0-preview") | .assets[] | select(.name=="wr-community-0.5.0-preview.apk") | .digest')
          test "$uploaded" = "sha256:$hash"
          gh release edit "$tag" --draft=false
      - name: Save build reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-0.5-build
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/reports/
            android/app/build/device-screenshots/
          retention-days: 14

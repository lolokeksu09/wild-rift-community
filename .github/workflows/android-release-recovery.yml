name: Publish prepared Android 0.3 preview
on:
  push:
    branches: [codex/android-account-client]
    paths: [.github/workflows/android-release-recovery.yml]
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify validated source and uploaded APK, then publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo=lolokeksu09/wild-rift-community
          gh api "repos/$repo/actions/jobs/112351831180" > validation.json
          jq -e '.steps[] | select(.name=="Build and validate preview" and .conclusion=="success")' validation.json >/dev/null
          gh api "repos/$repo/releases/404888818" > release.json
          jq -e '.tag_name=="android-v0.3.0-preview" and .target_commitish=="f093bff020471285029a9a033e15959c40c0b077" and .prerelease==true' release.json >/dev/null
          jq -e '.assets[] | select(.name=="wr-community-0.3.0-preview.apk" and .state=="uploaded" and .size==17778237 and .digest=="sha256:cd210806786665a566d8f92dd4e8cf3e687cfc8702ab7bf6fbcab92089f5d2be")' release.json >/dev/null
          gh api --method PATCH "repos/$repo/releases/404888818" -F draft=false -F prerelease=true > published.json
          jq -e '.draft==false and .prerelease==true' published.json >/dev/null
          jq -r '.html_url' published.json
